name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Astro Check
        run: npx astro check
        env:
          # astro.config.mjs treats any CI run as a production deployment and
          # throws when PUBLIC_SITE_URL is missing or localhost-only. That guard
          # is deliberate, but it fired here too: `npx astro check` loads the
          # config, GitHub always sets CI=true, and this step had no
          # PUBLIC_SITE_URL, so the check died on config load before it could
          # check a single file. Every run in this repo's history was red for
          # that reason alone, and the Build step below never ran.
          # This placeholder exists only so the check exercises the same
          # sitemap/config path as production.
          PUBLIC_SITE_URL: https://example.com

      - name: Build
        run: npm run build
        env:
          # This placeholder URL exists only so the CI build exercises the same sitemap generation path as production.
          PUBLIC_SITE_URL: https://example.com
